<html lang="fr">
<head>
<meta charset="utf-8">

</body>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</body>

</body>

<style>
*,*::before,*::after{box-sizing:border-box}
html{background:#120D0D;-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column like a gym logbook, bottom tab bar, full-screen sheets for the live session and editors.
   Palette borrows from competition plates: blue (20 kg) for actions, red (25 kg) for records, green (10 kg) for done sets. */
/* Hevor identity: warm near-black ground, brick red from the logo for actions, slanted italic condensed type echoing the mark's parallelograms. Gold marks records, green marks done sets. */
:root{
  --bg:#120D0D; --surface:#1C1515; --surface2:#271D1D; --ink:#F3ECEA; --muted:#AD9C9A; --line:#382B2B; --prop:#5A4747;
  --brand:#8C4848; --accent:#C9625F; --accent-soft:#3A2222; --on-accent:#FFFFFF;
  --pr:#E5B24E; --pr-soft:#3A2D16; --ok:#58C48C; --ok-soft:#16291F;
  --c-brick:#C9625F; --c-rose:#E08A86; --c-ember:#E07B4A; --c-sand:#D9B38C; --c-ash:#B9A9A7;
  --scrim:rgba(0,0,0,.7); --shadow:none;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px)}
html{min-height:100%}
body{overflow-x:hidden}
/* iPhone : la barre du bas ne se cale tout en bas que si la page dépasse l'écran, donc chaque page est un peu plus haute que l'écran */
#view>.wrap{min-height:calc(100vh + 2px)}
@supports (height:100lvh){#view>.wrap{min-height:calc(100lvh + 2px)}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top>.backb{margin-right:-4px;color:var(--ink);background:var(--surface)}
.top>.backb+div{flex:1;min-width:0}
.brand{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.logo-row{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brand);display:block;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.logo.xl{width:96px;height:96px;border-radius:22px}
h3,.folder-title,.sheet-h h2,.modal .big,.tpl h3{font-style:italic}
.sub{color:var(--muted);font-size:13px}
.sub::first-letter{text-transform:uppercase}
.sync{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;background:var(--surface);font-size:12px;color:var(--muted);max-width:46%;text-align:left;flex:none}
.sync .st-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"] .dot{background:var(--ok)}
.sync[data-s="saving"] .dot{background:var(--accent)}
.sync[data-s="offline"] .dot,.sync[data-s="retry"] .dot{background:#E2A400}
.sync[data-s="quota"] .dot{background:var(--pr)}
section{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{border:1.5px dashed var(--line);color:var(--muted);width:100%}
.btn.danger{background:var(--pr-soft);color:var(--pr)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* pictograms */
.fig{background:var(--surface2);border-radius:12px;flex:none;width:64px;height:64px;overflow:hidden}
.fig.sm{width:48px;height:48px;border-radius:10px}
.fig.lg{width:100%;height:auto;aspect-ratio:1/1;max-width:260px;margin:0 auto;border-radius:20px}
.fig svg{display:block;width:100%;height:100%}
.fig .b{stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .f{stroke:var(--muted);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.5}
.fig .h{fill:var(--ink)}
.fig .p{stroke:var(--prop);stroke-width:6;stroke-linecap:round;fill:none}
.fig .pt{stroke:var(--prop);stroke-width:2.5;stroke-linecap:round;fill:none}
.fig .g{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.fig .eq{stroke:var(--accent);stroke-width:3;fill:var(--surface)}
.fig .eqf{fill:var(--accent)}
.fig .cb{stroke:var(--accent);stroke-width:1.6;fill:none}
.fig .bd{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:3 3}

/* home */
.banner{display:flex;align-items:center;gap:12px;background:var(--brand);color:var(--on-accent);border-radius:var(--r);padding:14px}
.banner b{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.banner .btn{background:#120D0D;color:#FFFFFF;margin-left:auto}
.tpl{display:flex;flex-direction:column;gap:12px}
.tpl-top{display:flex;gap:12px;align-items:center}
.tpl-figs{display:flex}
.tpl-figs .fig{width:44px;height:44px;border-radius:10px;border:2px solid var(--surface)}
.tpl-figs .fig+.fig{margin-left:-12px}
.tpl h3{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.01em}
.tpl p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tpl-actions{display:flex;gap:8px}
.tpl-actions .primary{flex:1}
.hist{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:12px;width:100%;text-align:left}
.hist .d{width:44px;text-align:center;flex:none}
.hist .d b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.hist .d span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hist .m{flex:1;min-width:0}
.hist .m div{font-weight:600}
.hist .t{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px}
.empty .fig{width:110px;height:110px;border-radius:20px}
.empty h3{font-family:var(--f-display);font-size:24px}
.empty p{margin:0;color:var(--muted);max-width:34ch}

/* library */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;min-height:46px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:10px 0}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.folder{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left}
.folder .fig{width:100%;height:auto;aspect-ratio:16/10;background:color-mix(in srgb,var(--fc) 16%,var(--surface2))}
.folder b{color:var(--ink)}
.folder .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--fc);margin-right:6px;vertical-align:1px}
.folder b{font-family:var(--f-display);font-size:18px;line-height:1.1}
.folder span{font-size:12px;color:var(--muted)}
.back{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);padding:6px 0;align-self:flex-start}
.back svg{width:18px;height:18px}
.folder-title{font-family:var(--f-display);font-size:26px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;background:var(--surface);border-radius:12px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}
.row .m div{font-weight:600}
.row .m small{color:var(--muted);font-size:12.5px}
.row .m small b{color:var(--pr);font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.row.sel{outline:2px solid var(--accent)}
.row.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{flex:none;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-b .wrap{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.sheet-f{position:fixed;left:0;right:0;bottom:0;z-index:2;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sheet-f .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.sheet-f .in .btn{flex:1}

/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select{width:100%;max-width:100%;min-width:0;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.ed-item{display:flex;flex-direction:column;gap:10px}
.ed-top{display:flex;gap:10px;align-items:center}
.ed-top .nm{flex:1;min-width:0;font-weight:600;line-height:1.2}
.ed-top .nm small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stp{display:flex;flex-direction:column;gap:4px;background:var(--surface2);border-radius:10px;padding:8px}
.stp>span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stp>div{display:flex;align-items:center;justify-content:space-between}
.stp button{width:34px;height:34px;border-radius:9px;background:var(--surface);font-size:20px;font-weight:600;line-height:1}
.stp output{font-family:var(--f-display);font-size:22px;font-weight:700}

/* live session */
.sess-h .elapsed{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
.sc{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;border:2px solid transparent}
.sc.cur{border-color:var(--accent)}
.sc.done{opacity:.72}
.sc-head{display:flex;gap:12px;align-items:center}
.sc.cur .fig{width:84px;height:84px}
.sc-title{flex:1;min-width:0}
.sc-title h3{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1}
.sc-title p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sc-menu{display:flex;gap:6px;flex-wrap:wrap}
.sc-menu .btn{min-height:36px;padding:0 12px;font-size:13px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:10px;padding:8px 9px;min-width:0}
.st .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.st b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap}
.st small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.rec{background:var(--pr-soft)}
.st.rec .lbl,.st.rec b{color:var(--pr)}
.st.in{background:var(--accent-soft);cursor:text}
.st.in .lbl{color:var(--accent)}
.inrow{display:flex;align-items:baseline;gap:3px}
.inrow input{width:100%;min-width:0;border:0;background:none;outline:none;font-family:var(--f-display);font-size:24px;font-weight:700;padding:0;line-height:1.1;color:var(--ink)}
.inrow input::placeholder{color:var(--muted);opacity:.55}
.inrow span{font-size:12px;color:var(--muted);font-weight:600}
.st small.prtag{color:var(--pr);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.set{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:9px 10px;border-radius:12px;border:2px solid var(--line);text-align:left;position:relative;min-height:56px}
.set .sn{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.set .sr{font-family:var(--f-display);font-size:19px;font-weight:700}
.set .ck{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.set.on{background:var(--ok-soft);border-color:var(--ok)}
.set.on .sn{color:var(--ok)}
.set.on .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:3;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--brand);color:#FFFFFF;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.rest .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rest .r1{display:flex;align-items:center;gap:12px}
.rest .clock{font-family:var(--f-display);font-weight:700;font-size:54px;line-height:.9;min-width:3.2ch}
.rest .lab{flex:1;min-width:0}
.rest .lab small{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.7;font-weight:600}
.rest .lab div{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rest .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.rest .bar i{display:block;height:100%;background:#FFFFFF;border-radius:3px}
.rest .r2{display:flex;gap:8px}
.rest .r2 button{flex:1;min-height:42px;border-radius:11px;background:rgba(0,0,0,.22);color:#FFFFFF;font-weight:600}
.rest .r2 button.go{background:#120D0D;color:#FFFFFF}
.rest .clock{font-style:italic}
.rest.ding .clock{color:#FFE7A8}
.rest.work{background:#E07B4A}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border-radius:10px;padding:4px}
.seg button{min-height:34px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ed-note{grid-column:span 1;display:flex;align-items:center;background:var(--surface2);border-radius:10px;padding:8px;font-size:12.5px;color:var(--muted)}
.set.max{padding-right:44px}
.set.max input{width:100%;min-width:0;border:0;background:none;outline:none;font-family:var(--f-display);font-size:19px;font-weight:700;padding:0;color:var(--ink)}
.set.max input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.set.max .ck{width:30px;height:30px;top:12px;right:8px;font-size:15px;color:var(--muted)}
.set.run{border-color:#E07B4A;background:color-mix(in srgb,#E07B4A 14%,transparent)}
.set.run .sn{color:#E07B4A}

/* modal */
.scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:24px;padding:24px 20px 18px;width:100%;max-width:400px;max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal .emo{font-size:76px;line-height:1.05}
.modal .emo.multi{font-size:46px;letter-spacing:-.05em}
.modal .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modal .big{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;color:var(--accent)}
.modal .cmp{font-size:17px;font-weight:600}
.modal h3{font-family:var(--f-display);font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:var(--surface2);padding:5px 10px;border-radius:99px;font-size:13px;font-weight:600}
.prs{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--pr-soft);border-radius:12px;padding:10px 12px}
.prs .k{color:var(--pr)}
.prs div{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.prs div span:last-child{color:var(--pr);white-space:nowrap}
.modal .acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}

function poseAt(p,t){const A=p._a,B=p._b,o={};for(const k in A){const a=A[k],b=B[k];o[k]=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}return o}

function figSVG(ex,t){
  const p=PAT[ex.pat]||PAT.squat,q=poseAt(p,t),eq=ex.eq;let s='<line x1="6" y1="94" x2="94" y2="94" class="g"/>';
  (p.props||[]).forEach(k=>{s+=PROPS[k](q)});
  const arm=(N,E,W,c)=>pl([N,E,W],c),leg=(P,K,F,c)=>pl([P,K,F],c);

  // cables & bands behind body

  if(eq==='P'||eq==='E'){const a=eq==='E'?(p.anc||[96,hand[1]]):(p.pul||[60,-6]);const cls=eq==='E'?'bd':'cb';
    s+=ln(a,hand,cls)+(eq==='P'?`<circle cx="${a[0]}" cy="${a[1]}" r="2.6" class="eq" style="stroke-width:2"/>`:'');
    if(p.sym){const m2=mir(hand),am=mir(a);s+=ln(am,m2,cls)+(eq==='P'?`<circle cx="${am[0]}" cy="${am[1]}" r="2.6" class="eq" style="stroke-width:2"/>`:'')}}
  if(p.sym){

    s+=ln(S,mir(S),'b')+ln(q.N,q.P,'b')+ln(Q,mir(Q),'b');
    s+=leg(Q,q.K,q.F,'b')+leg(mir(Q),mir(q.K),mir(q.F),'b');
    s+=arm(S,q.E,q.W,'b')+arm(mir(S),mir(q.E),mir(q.W),'b');
    s+=`<circle cx="${q.H[0].toFixed(1)}" cy="${q.H[1].toFixed(1)}" r="6.5" class="h"/>`;
    if(eq==='B'){const y=q.W[1],x1=q.W[0]-12,x2=100-q.W[0]+12;s+=`<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" class="cb" style="stroke-width:2.6"/><rect x="${(x1-2).toFixed(1)}" y="${(y-8).toFixed(1)}" width="4" height="16" rx="1.5" class="eqf"/><rect x="${(x2-2).toFixed(1)}" y="${(y-8).toFixed(1)}" width="4" height="16" rx="1.5" class="eqf"/>`}
    else if(eq==='H')s+=dumb(q.W)+dumb(mir(q.W));
    else if(eq==='K')s+=kb(q.W)+kb(mir(q.W));
    else if(eq==='M'||eq==='P'||eq==='E')s+=`<circle cx="${q.W[0].toFixed(1)}" cy="${q.W[1].toFixed(1)}" r="2.8" class="eqf"/><circle cx="${(100-q.W[0]).toFixed(1)}" cy="${q.W[1].toFixed(1)}" r="2.8" class="eqf"/>`;
    return `<svg viewBox="0 -10 100 106" aria-hidden="true">${s}</svg>`;
  }
  if(q.k)s+=leg(q.P,q.k,q.f,'f');
  if(q.e)s+=arm(q.N,q.e,q.w,'f');
  s+=ln(q.N,q.P,'b')+leg(q.P,q.K,q.F,'b')+toe(q.F);
  const bodyFirst=p.bar==='N';
  if(eq==='B'&&p.bar){const o=p.off||[0,0],c=q[p.bar];s+=plate([c[0]+o[0],c[1]+o[1]])}
  s+=`<circle cx="${q.H[0].toFixed(1)}" cy="${q.H[1].toFixed(1)}" r="6.5" class="h"/>`;
  s+=arm(q.N,q.E,q.W,'b');
  if(eq==='B'&&!p.bar)s+=plate(q.W);
  else if(eq==='H')s+=dumb(q.W);
  else if(eq==='K')s+=kb(q.W);
  else if(eq==='M'){if(p.legm)s+=`<circle cx="${q.F[0].toFixed(1)}" cy="${(q.F[1]-1).toFixed(1)}" r="3.6" class="eqf"/>`;else if(!p.nohand)s+=`<circle cx="${q.W[0].toFixed(1)}" cy="${q.W[1].toFixed(1)}" r="3" class="eqf"/>`}
  else if((eq==='P'||eq==='E')&&p.to!=='F')s+=`<circle cx="${q.W[0].toFixed(1)}" cy="${q.W[1].toFixed(1)}" r="2.8" class="eqf"/>`;
  void bodyFirst;
  return `<svg viewBox="0 -10 100 106" aria-hidden="true">${s}</svg>`;
}

async function pull(){
  if(!DB)return;
  const m=await metaRef().get();
  if(m.exists){const d=m.data()||{};const ds=d.stamp||0;
    const del=new Set([...(S.deleted||[]),...(d.deleted||[])]);
    if(ds>S.stamp.meta){S.templates=d.templates||[];S.custom=d.custom||[];S.settings={...S.settings,...(d.settings||{})};S.stamp.meta=ds}
    else if(S.stamp.meta>ds)mark('meta');
    if(del.size!==(d.deleted||[]).length)mark('meta');
    S.deleted=[...del];
  }else if(S.stamp.meta||S.templates.length||S.custom.length){mark('meta')}
  const a=await activeRef().get();
  if(a.exists){const d=a.data()||{};if((d.stamp||0)>S.stamp.active){S.active=d.session||null;S.stamp.active=d.stamp||0}else if(S.stamp.active>(d.stamp||0))mark('active')}
  else if(S.active)mark('active');
  const q=await sessCol().get();const cloud=new Set();const del=new Set(S.deleted);
  for(const doc of q.docs){cloud.add(doc.id);if(del.has(doc.id)){mark('d:'+doc.id);continue}
    if(!S.sessions.some(s=>s.id===doc.id)){const d=doc.data();if(d&&d.id)S.sessions.push(clone(d))}}
  for(const s of S.sessions)if(!cloud.has(s.id))mark('s:'+s.id);
  S.sessions.sort((a,b)=>a.date-b.date);

  if(VIEW==='pass')requestAnimationFrame(()=>requestAnimationFrame(()=>scrollToCur(false)));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function q(p){if(!p)return;p.catch(()=>{});return Promise.race([p,sleep(5000).then(()=>{queued=true})])}
let queued=false;
async function write(tok){return q(write0(tok))}
function write0(tok){
  if(tok==='meta')return metaRef().set({templates:S.templates,custom:S.custom,settings:S.settings,deleted:S.deleted.slice(-500),stamp:S.stamp.meta});
  if(tok==='active')return activeRef().set({session:S.active,stamp:S.stamp.active});
  if(tok.startsWith('s:')){const s=S.sessions.find(x=>x.id===tok.slice(2));if(s)return sessCol().doc(s.id).set(s);return}
  if(tok.startsWith('d:'))return sessCol().doc(tok.slice(2)).delete();
}
async function flushCheck(){if(!DB||!fs)return;try{await fs.waitForPendingWrites();if(!S.dirty.length)setSync('ok')}catch(e){}}
function flushSoon(){clearTimeout(flushT);flushT=setTimeout(flush,400)}
async function flush(){
  if(!DB){setSync('local');return}
  if(flushing)return;
  if(!S.dirty.length){if(syncState!=='pending')setSync(navigator.onLine===false?'offline':'ok');return}
  flushing=true;setSync('saving');
  queued=false;try{while(S.dirty.length){const tok=S.dirty[0];await write(tok);S.dirty=S.dirty.filter(t=>t!==tok);persist()}setSync(queued?'pending':'ok');if(queued)setTimeout(flushCheck,20000)}
  catch(e){const c=e&&e.code;if(c==='quota_exceeded')setSync('quota');else if(c==='invalid_argument'){S.dirty.shift();persist();setSync('retry');setTimeout(flush,2000)}else if(c==='revoked'||c==='not_granted'){DB=null;setSync('local')}else{setSync(navigator.onLine===false?'offline':'retry');setTimeout(flush,15000)}}
  finally{flushing=false}
}

/* ---------- live session ---------- */
let wakeLock=null;
async function wake(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function startSession(id){
  const t=S.templates.find(x=>x.id===id);if(!t||S.active)return;
  S.active={id:gid(),tplId:t.id,name:t.name,start:Date.now(),items:t.items.map(it=>({...it,mode:modeOf(it),name:exo(it.exoId).name,weight:'',done:Array(it.sets).fill(false),repsDone:Array(it.sets).fill('')})),timer:null};
  touchActive(0);openSession();render();
}
function openSession(){menuOpen=-1;openSheet('session','');renderSession();wake();ensureTick()}
function curIndex(){return S.active.items.findIndex(it=>!it.done.every(Boolean))}
function renderSession(){
  const a=S.active;const el=document.getElementById('sheet-session');if(!a||!el)return;
  const sc=el.querySelector('.sheet-b')?.scrollTop||0;const ci=curIndex();
  let h=`<div class="sheet-h sess-h"><button class="icon-btn" data-act="sess-min" aria-label="Réduire">${ICON.back}</button><h2>${esc(a.name)}</h2><span class="elapsed num" id="elapsed">${mmss((Date.now()-a.start)/1000)}</span><button class="btn primary" style="min-height:38px;padding:0 12px" data-act="sess-end">Terminer</button></div>
   <div class="sheet-b"><div class="wrap" style="display:flex;flex-direction:column;gap:12px">`;
  a.items.forEach((it,i)=>{h+=sessCard(it,i,i===ci)});
  h+=`<button class="btn line" data-act="sess-add">+ Ajouter un exercice à cette séance</button></div></div><div id="rest-slot"></div>`;
  el.innerHTML=h;el.querySelector('.sheet-b').scrollTop=sc;registerAnim();updateRest();
}
function sessCard(it,i,cur){
  const e=exo(it.exoId,it.name),rec=recOf(it.exoId),last=lastOf(it.exoId);
  const all=it.done.every(Boolean),w=parseW(it.weight),isPR=w!=null&&rec&&w>rec.w;
  return `<article class="sc ${all?'done':''} ${cur?'cur':''}" id="sc-${i}">
   <div class="sc-head"><div class="fig ${cur?'anim':''}" data-ex="${it.exoId}">${figSVG(e,cur?0:1)}</div>
    <div class="sc-title"><h3>${esc(e.name)}</h3><p>${volTxt(it)} · repos ${mmss(it.restSet)}${all?' · terminé':''}</p></div>
    <button class="icon-btn" data-act="sx-menu" data-i="${i}" aria-label="Options de l'exercice">${ICON.more}</button></div>
   ${menuOpen===i?`<div class="sc-menu"><button class="btn ghost" data-act="sx-move" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>Monter</button><button class="btn ghost" data-act="sx-move" data-i="${i}" data-d="1" ${i===S.active.items.length-1?'disabled':''}>Descendre</button><button class="btn ghost" data-act="sx-addset" data-i="${i}">+1 série</button><button class="btn danger" data-act="sx-del" data-i="${i}">Retirer</button></div>`:''}
   <div class="stats3">
    <div class="st rec"><span class="lbl">Record</span><b class="num">${rec?fmtKg(rec.w):'—'}</b><small>${rec?dfr(rec.t):'pas encore'}</small></div>
    <div class="st"><span class="lbl">Dernière fois</span><b class="num">${last?fmtKg(last.w):'—'}</b><small>${last?ago(last.t):'première fois'}</small></div>
    <label class="st in" for="w-${i}"><span class="lbl">Aujourd'hui</span><span class="inrow"><input id="w-${i}" data-wi="${i}" inputmode="decimal" enterkeyhint="done" placeholder="${last?numStr(last.w):'0'}" value="${esc(it.weight)}" autocomplete="off" aria-label="Poids aujourd'hui en kg"><span>kg</span></span><small class="${isPR?'prtag':''}" id="prt-${i}">${isPR?'Nouveau record !':'&nbsp;'}</small></label>
   </div>
   <div class="sets">${it.done.map((d,j)=>setHTML(it,i,j,d)).join('')}</div>
  </article>`;
}
function setHTML(it,i,j,d){
  const m=modeOf(it),t=S.active.timer,run=t&&t.kind==='work'&&t.i===i&&t.j===j;
  if(m==='max'){const v=(it.repsDone||[])[j]??'';return `<div class="set max ${d?'on':''}"><span class="sn">Série ${j+1}</span><input id="r-${i}-${j}" data-ri="${i}" data-rj="${j}" inputmode="numeric" placeholder="reps" value="${esc(v)}" autocomplete="off" aria-label="Reps faites série ${j+1}"><button class="ck" data-act="set" data-i="${i}" data-j="${j}" aria-pressed="${d}" aria-label="Valider la série ${j+1}">✓</button></div>`}
  if(m==='time')return `<button class="set ${d?'on':''} ${run?'run':''}" data-act="set" data-i="${i}" data-j="${j}" aria-pressed="${d}"><span class="sn">${run?'En cours':'Série '+(j+1)}</span><span class="sr">${d?mmss(it.dur||60):run?'…':'▶ '+mmss(it.dur||60)}</span><span class="ck">✓</span></button>`;
  return `<button class="set ${d?'on':''}" data-act="set" data-i="${i}" data-j="${j}" aria-pressed="${d}"><span class="sn">Série ${j+1}</span><span class="sr">${it.reps} reps</span><span class="ck">✓</span></button>`;
}
function afterSetDone(i){
  const a=S.active,it=a.items[i],all=it.done.every(Boolean);
  if(!all){const nx=it.done.indexOf(false);startTimer('set',it.restSet,`Série ${nx+1} · ${exo(it.exoId,it.name).name}`)}
  else{const ni=curIndex();if(ni>=0){startTimer('exo',it.restExo,exo(a.items[ni].exoId,a.items[ni].name).name)}else{a.timer=null;toast('Toutes les séries sont validées. Termine ta séance quand tu veux.')}}
  touchActive(400);renderSession();
  if(all){const ni=curIndex();if(ni>=0)setTimeout(()=>document.getElementById('sc-'+ni)?.scrollIntoView({behavior:'smooth',block:'start'}),120)}
}
function toggleSet(i,j){
  const a=S.active,it=a.items[i];if(!it)return;
  const m=modeOf(it),t=a.timer;
  if(it.done[j]){it.done[j]=false;touchActive();renderSession();return}
  if(m==='time'&&t&&t.kind==='work'&&t.i===i&&t.j===j){a.timer=null;it.done[j]=true;afterSetDone(i);return}
  if(m==='max'&&!(parseInt((it.repsDone||[])[j],10)>0)){const box=$(`#r-${i}-${j}`);const c=box?.closest('.set');c?.classList.remove('shake');void c?.offsetWidth;c?.classList.add('shake');box?.focus();toast('Indique le nombre de reps faites');return}
  if(parseW(it.weight)==null){const e=exo(it.exoId),last=lastOf(it.exoId);
    if(last){it.weight=numStr(last.w);toast(`Poids de la dernière fois repris : ${fmtKg(last.w)}`)}
    else if(e.eq==='C'||e.eq==='X'){it.weight='0'}
    else{const box=document.querySelector(`#sc-${i} .st.in`);box?.classList.remove('shake');void box?.offsetWidth;box?.classList.add('shake');$('#w-'+i)?.focus();toast("Indique d'abord le poids utilisé");return}}
  unlockAudio();
  if(m==='time'){const d=it.dur||60;a.timer={kind:'work',i,j,end:Date.now()+d*1000,total:d,label:`${exo(it.exoId,it.name).name} · série ${j+1}`,fired:false};ensureTick();touchActive(400);renderSession();return}
  it.done[j]=true;afterSetDone(i);
}
function startTimer(kind,sec,label){if(!sec){S.active.timer=null;updateRest();return}S.active.timer={kind,end:Date.now()+sec*1000,total:sec,label,fired:false};ensureTick();updateRest()}
let tickH=null;
function ensureTick(){if(!tickH)tickH=setInterval(tick,250)}
function tick(){
  if(!S.active){clearInterval(tickH);tickH=null;return}
  const el=$('#elapsed');if(el)el.textContent=mmss((Date.now()-S.active.start)/1000);
  const t=S.active.timer;if(!t)return;
  if(!t.fired&&Date.now()>=t.end&&t.kind==='work'){ding();const it=S.active.items[t.i];S.active.timer=null;if(it){it.done[t.j]=true;afterSetDone(t.i)}return}
  if(!t.fired&&Date.now()>=t.end){t.fired=true;ding();touchActive();setTimeout(()=>{if(S.active&&S.active.timer===t){S.active.timer=null;touchActive();updateRest()}},3000)}
  updateRest();
}
function updateRest(){
  const slot=$('#rest-slot');if(!slot)return;const t=S.active&&S.active.timer;
  if(!t){slot.innerHTML='';return}
  const rem=Math.max(0,(t.end-Date.now())/1000),pct=Math.min(100,(1-rem/t.total)*100);
  const work=t.kind==='work';
  const html=`<div class="rest ${t.fired?'ding':''} ${work?'work':''}" role="timer" aria-live="off"><div class="in"><div class="r1"><div class="clock num">${t.fired?'0:00':mmss(Math.ceil(rem))}</div><div class="lab"><small>${work?'Effort en cours':t.fired?"C'est reparti":t.kind==='set'?'Repos · prochaine':'Repos · exercice suivant'}</small><div>${esc(t.label)}</div></div></div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
   <div class="r2"><button data-act="rest-adj" data-d="-15">−15 s</button><button data-act="rest-adj" data-d="15">+15 s</button><button class="go" data-act="rest-skip">${work?'Série finie':t.fired?'OK':'Passer'}</button></div></div></div>`;
  if(!slot.firstChild){slot.innerHTML=html;return}
  slot.querySelector('.clock').textContent=t.fired?'0:00':mmss(Math.ceil(rem));slot.querySelector('.bar i').style.width=pct.toFixed(1)+'%';
  const r=slot.querySelector('.rest');if(t.fired!==r.classList.contains('ding'))slot.innerHTML=html;
}
let AC=null;
function unlockAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function ding(){
  if(!S.settings.sound)return;
  try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(e){}
  try{if(!AC)return;const t0=AC.currentTime;[0,.22,.44].forEach((d,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=k===2?1320:880;g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.18);o.connect(g).connect(AC.destination);o.start(t0+d);o.stop(t0+d+.2)})}catch(e){}
}
function endConfirm(){
  const a=S.active,done=a.items.reduce((n,it)=>n+it.done.filter(Boolean).length,0),tot=a.items.reduce((n,it)=>n+it.done.length,0);
  modal(`<h3>Terminer la séance ?</h3><p class="muted" style="margin:0">${done} série${done>1?'s':''} validée${done>1?'s':''} sur ${tot}. Seules les séries cochées comptent pour le poids total et les records.</p>
   <div class="acts"><button class="btn primary" data-act="sess-finish" ${done?'':'disabled'}>Terminer et voir le bilan</button><button class="btn ghost" data-act="modal-close">Continuer la séance</button><button class="btn danger" data-act="sess-discard">Abandonner sans enregistrer</button></div>`);
}
function finishSession(){
  const a=S.active;if(!a)return;
  const prs=[];
  const items=a.items.map(it=>{const n=it.done.filter(Boolean).length;const w=parseW(it.weight);const m=modeOf(it);

async function getDownloads(){return{save:async({filename,data})=>{
  const type=filename.endsWith('.pdf')?'application/pdf':filename.endsWith('.json')?'application/json':'application/octet-stream';

  try{const file=new File([blob],filename,{type});if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return{status:'saved'}}}
  catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return{status:'saved'};

  'sx-menu':d=>{menuOpen=menuOpen===+d.i?-1:+d.i;renderSession()},
  'sx-move':d=>{const a=S.active.items,i=+d.i,j=i+(+d.d);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];menuOpen=j;touchActive();renderSession()},
  'sx-addset':d=>{const it=S.active.items[+d.i];it.done.push(false);(it.repsDone||(it.repsDone=[])).push('');it.sets=it.done.length;touchActive();renderSession()},
  'sx-del':d=>{S.active.items.splice(+d.i,1);menuOpen=-1;touchActive();renderSession()},
  'rest-adj':d=>{const t=S.active.timer;if(!t)return;if(t.fired){t.fired=false;t.end=Date.now()}t.end=Math.max(Date.now()+1000,t.end+(+d.d)*1000);t.total=Math.max(t.total,(t.end-Date.now())/1000);touchActive();updateRest()},
  'rest-skip':()=>{const t=S.active.timer;if(t&&t.kind==='work'){const it=S.active.items[t.i];S.active.timer=null;if(it){it.done[t.j]=true;afterSetDone(t.i)}return}S.active.timer=null;touchActive();updateRest()},
  'modal-close':()=>closeModal(),
  'map-cur':()=>scrollToCur(true),
  nd:d=>{const T=TIERS[+d.n-1],P=passAt(totalKg()),st=T.n<=P.lvl?'done':T.n===P.lvl+1?'cur':'lock';
    modal(`<div class="emo">${T.emo}</div><div class="k">Niveau ${T.n}</div><h3>${esc(T.name)}</h3><p class="muted" style="margin:0">Se débloque quand ton total soulevé atteint <b class="num">${fmtT(T.thr)}</b>.</p>
     ${st==='done'?'<div class="cmp" style="color:var(--ok)">Débloqué ✓</div>':st==='cur'?`<div class="mbar"><i style="width:${P.pct.toFixed(1)}%"></i></div><div class="mrow num"><span>${fmtT(P.into)} / ${fmtT(P.need)}</span><span>encore ${fmtT(P.need-P.into)}</span></div>`:`<div class="cmp">Encore ${fmtT(T.thr-P.t)} au total</div>`}
     <div class="acts"><button class="btn primary" data-act="modal-close">OK</button></div>`)},
  'see-pass':()=>{closeModal();ACT.tab({v:'pass'})},
  'go-back':()=>goBack(),
  'lg-mode':d=>{loginMode=d.m;showLogin()},
  logout:()=>{logoutAsk=true;render()}, 'logout-no':()=>{logoutAsk=false;render()},
  'logout-yes':async()=>{logoutAsk=false;try{await fbAuth.signOut()}catch(e){}},
  pdf:(d,b)=>exportPDF(b), 'export-json':()=>exportJSON(), 'import-json':()=>$('#imp').click(),
  'set-rs':d=>{S.settings.restSet=Math.min(600,Math.max(0,S.settings.restSet+15*(+d.d)));touchMeta();render()},
  'set-re':d=>{S.settings.restExo=Math.min(600,Math.max(0,S.settings.restExo+15*(+d.d)));touchMeta();render()},
  sound:()=>{S.settings.sound=!S.settings.sound;touchMeta();render();if(S.settings.sound){unlockAudio();ding()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.wi!=null&&S.active){const i=+t.dataset.wi,it=S.active.items[i];if(!it)return;it.weight=t.value.replace(/[^\d.,]/g,'');if(it.weight!==t.value)t.value=it.weight;
    const w=parseW(it.weight),r=recOf(it.exoId),pr=$('#prt-'+i);if(pr){const is=w!=null&&r&&w>r.w;pr.className=is?'prtag':'';pr.innerHTML=is?'Nouveau record !':'&nbsp;'}touchActive(1500);return}
  if(t.dataset.ri!=null&&S.active){const it=S.active.items[+t.dataset.ri];if(!it)return;const v=t.value.replace(/\D/g,'').slice(0,3);if(v!==t.value)t.value=v;(it.repsDone||(it.repsDone=[]))[+t.dataset.rj]=v;touchActive(1500);return}
  if(t.id==='ed-name'&&ed){ed.name=t.value;return}
  if(t.id==='lib-q'){libB.q=t.value;$('#lib-res').innerHTML=browseRes(libB,'lib');return}
  if(t.id==='pick-q'&&pick){pick.q=t.value;$('#pick-res').innerHTML=browseRes(pick,'pick');return}
});
document.addEventListener('change',e=>{if(e.target.id==='st-exo'){statsExo=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.wi!=null)e.target.blur()});

/* ---------- boot ---------- */
bootAccounts();
if('serviceWorker' in navigator&&location.protocol==='https:'){
  let reloaded=false;const hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded&&!S.active){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{})});
}
</script>
</body>
</html>
